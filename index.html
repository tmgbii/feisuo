<!doctype html>
<html lang="zh-CN" class="dark booting">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飞梭 · 现代通讯调试助手</title>
    <style>
      html, body { margin: 0; height: 100%; }
      html.booting, html.booting body { background: #0B0D10; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0B0D10;
        color: #e8edf4;
        font-family: system-ui, sans-serif;
        transition: opacity .28s ease;
      }
      #splash.is-done { opacity: 0; pointer-events: none; }
      #splash img { width: 56px; height: 56px; border-radius: 14px; }
      #splash .name { font-size: 18px; font-weight: 650; letter-spacing: .06em; }
      #splash .en { font-size: 11px; color: #8b95a5; letter-spacing: .16em; }
      #splash .bar {
        width: 88px;
        height: 2px;
        margin-top: 6px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #38bdf8, transparent);
        background-size: 200% 100%;
        animation: splash-move 1.1s linear infinite;
      }
      @keyframes splash-move {
        from { background-position: 100% 0; }
        to { background-position: -100% 0; }
      }
    </style>
  </head>
  <body class="dark">
    <div id="splash">
      <img src="/icon.png" alt="" />
      <div class="name">飞梭 · 现代通讯调试助手</div>
      <div class="en">FEISUO</div>
      <div class="bar"></div>
    </div>
    <div id="app"></div>
    <script>
      window.__splashAt = performance.now();
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
      window.setTimeout(function () {
        document.documentElement.classList.remove("booting");
        var el = document.getElementById("splash");
        if (!el || el.classList.contains("is-done")) return;
        el.classList.add("is-done");
        window.setTimeout(function () { el.remove(); }, 280);
      }, 8000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
