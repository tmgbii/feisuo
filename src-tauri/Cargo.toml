[package]
name = "commbox"
version = "0.9.8"
description = "飞梭 · 现代通讯调试助手"
authors = ["you"]
edition = "2021"

[lib]
name = "commbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "fs", "process"] }
network-interface = "2.0.1"
surge-ping = "0.8"
tokio-util = { version = "0.7", features = ["compat"] }
tokio-serial = "5.4"
serialport = "4.7"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
rumqttc = { version = "0.24", features = ["use-native-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip", "stream"] }
futures-util = "0.3"
bytes = "1"
russh = { version = "0.61", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.1"
suppaftp = { version = "12.0.0", default-features = false, features = ["tokio"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
  "mysql",
  "sqlite",
  "chrono",
  "rust_decimal",
  "json",
] }
tiberius = { version = "0.12", default-features = false, features = [
  "tds73",
  "chrono",
  "rust_decimal",
  "native-tls",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo", "NSString"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
# debuginfo：macOS 本地网络权限靠 Mach-O UUID，strip=true 会剥掉。
strip = "debuginfo"
